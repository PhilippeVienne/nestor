# Bord du tailnet pour Nestor : Traefik (TLS, routage par nom) et dnsmasq (DNS partage).
# Les deux sont sur le reseau de l'hote et n'ecoutent que sur l'adresse Tailscale de la
# machine : rien n'est joignable depuis le reseau local ni depuis Internet.
#
#   docker compose --env-file ~/.config/nestor-edge/cloudflare.env up -d
#
# Le fichier d'environnement porte CF_DNS_API_TOKEN (jeton Cloudflare limite a la zone,
# pour le defi DNS-01) et ACME_EMAIL (compte Let's Encrypt). Voir ../../docs/tailscale.md.
services:
  traefik:
    image: traefik:v3.6
    container_name: nestor-edge-traefik
    restart: unless-stopped
    network_mode: host
    command:
      - --configfile=/etc/traefik/traefik.yml
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL:?ACME_EMAIL manquant dans le fichier d'environnement}
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?CF_DNS_API_TOKEN manquant dans le fichier d'environnement}
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
      - acme:/acme

  dnsmasq:
    build: ./dnsmasq
    image: nestor-edge-dnsmasq
    container_name: nestor-edge-dnsmasq
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro

volumes:
  acme:
