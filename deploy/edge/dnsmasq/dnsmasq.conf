# DNS partage du tailnet pour vienne.me : declare dans la console Tailscale
# (DNS > Nameservers > Add nameserver > 100.84.235.85, restreint a vienne.me).
# nestor.vienne.me repond l'adresse Tailscale de kanto ; le reste de la zone est
# transmis a Cloudflare. N'ecoute que sur l'adresse Tailscale.
port=53
listen-address=100.84.235.85
bind-interfaces
no-resolv
no-hosts
# Autoritaire sur ce nom : rien n'est transmis a Cloudflare pour lui, donc pas d'AAAA
# public. Sans cela, un client qui prefere l'IPv6 partait vers la page publique.
local=/nestor.vienne.me/
address=/nestor.vienne.me/100.84.235.85
server=1.1.1.1
server=1.0.0.1
cache-size=500
